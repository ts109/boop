[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "boop"
version = "0.0"
authors = [{name = "Tillmann Stübler", email = "ts109@pm.me"}]
dependencies = ["sympy"]
requires-python = ">= 3.14"

[project.optional-dependencies]
test = ["numpy", "pytest"]

[tool.setuptools.package-data]
boop = ["c_runtime/*.c", "c_runtime/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true
